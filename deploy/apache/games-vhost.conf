# Games site: Soncrant Arcade
# Source of truth: soncsec/games-portal deploy/apache/games-vhost.conf (P1.6)
# Replaces the existing "# Games site" block in /etc/apache2/sites-enabled/soncrant-sites.conf.
# Needs mod_headers (a2enmod headers). Always run `apachectl configtest` before reloading.
<VirtualHost *:80>
    ServerName games.rdmustang.com
    ServerAlias games.soncrant.com
    DocumentRoot /var/www/html/soncrant.com/pub/games

    ErrorLog ${APACHE_LOG_DIR}/games.soncrant.com-error.log
    CustomLog ${APACHE_LOG_DIR}/games.soncrant.com-access.log combined

    # Portal and game folders. "Options" without +/- replaces the inherited
    # "Indexes FollowSymLinks": no folder listings, and a symlink is only
    # followed when the link and its target have the same owner (deploy).
    <Directory /var/www/html/soncrant.com/pub/games>
        Options SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
    </Directory>

    # Game releases (ADR-009). Only reachable through the games/<slug> symlinks:
    # this folder is outside the document root, so it has no URL of its own.
    <Directory /srv/games-releases>
        Options SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
    </Directory>

    # Security headers (ADR-007). Everything is served from this origin:
    # no third-party scripts, styles, fonts or connections.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"

    # Caching: by default browsers recheck every file (cheap, thanks to ETags),
    # so a new release shows up at once. Vite's script, style and font files
    # carry a content hash in their name (name-AbC123xY.js), so they never
    # change and can be cached for a year. Sprites are not hashed, so they
    # stay on the default.
    Header set Cache-Control "no-cache"
    <LocationMatch "/assets/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css|ttf|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</VirtualHost>
